<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Beyblade X Scoreboard</title>
    
    <!-- PWA & Mobile Web App Meta Tags -->
    <link rel="manifest" href="./manifest.json">
    <meta name="theme-color" content="#111827">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
            -webkit-user-select: none;
            -webkit-touch-callout: none;
            touch-action: manipulation;
        }

        body, html {
            height: 100vh;
            height: 100dvh; /* Dynamic viewport height adjusts for browser bars */
            width: 100vw;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            overflow: hidden;
            background-color: #121212;
            overscroll-behavior: none;
        }

        #scoreboard-container {
            display: flex;
            flex-direction: row;
            height: 100vh;
            height: 100dvh; /* Dynamic viewport height */
            width: 100vw;
            position: relative;
        }

        /* Solid, uniform background across each full team side */
        .team-side {
            flex: 1;
            position: relative;
            height: 100%;
            color: #ffffff;
            overflow: hidden;
        }

        #red-side {
            background-color: #D32F2F; /* Deep vibrant red */
            border-right: 2px solid rgba(0, 0, 0, 0.2);
        }

        #blue-side {
            background-color: #1976D2; /* Deep vibrant blue */
        }

        /* Upper half tap zone (+1 Point) */
        .tap-zone-upper {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 50%;
            z-index: 1;
            cursor: pointer;
            display: flex;
            justify-content: center;
            align-items: flex-start;
            padding-top: calc(24px + env(safe-area-inset-top, 0px));
        }

        /* Lower half tap zone (-1 Point & Buttons) */
        .tap-zone-lower {
            position: absolute;
            top: 50%;
            left: 0;
            width: 100%;
            height: 50%;
            z-index: 1;
            cursor: pointer;
            display: flex;
            flex-direction: column;
            justify-content: flex-end;
            align-items: center;
            /* Safe area padding prevents browser bottom gesture/nav bar from covering buttons */
            padding-bottom: calc(28px + env(safe-area-inset-bottom, 0px));
            padding-left: 12px;
            padding-right: 12px;
        }

        .tap-hint {
            font-size: 0.75rem;
            font-weight: 800;
            letter-spacing: 2px;
            text-transform: uppercase;
            opacity: 0.55;
            pointer-events: none;
        }

        .tap-hint-bottom {
            margin-bottom: 8px;
        }

        /* Large white score digit positioned cleanly above controls */
        .score-display {
            position: absolute;
            top: 45%;
            left: 50%;
            transform: translate(-50%, -50%);
            z-index: 5;
            pointer-events: none; /* Taps pass through to tap zones underneath */
            font-size: 32vmin;
            font-weight: 900;
            line-height: 1;
            color: #ffffff;
            text-shadow: 0 8px 24px rgba(0, 0, 0, 0.35);
            user-select: none;
            transition: top 0.2s ease, font-size 0.2s ease;
        }

        /* Button container at bottom of each side */
        .button-group {
            display: flex;
            flex-direction: column;
            gap: 8px;
            width: 100%;
            max-width: 230px;
            z-index: 10; /* Sits above tap zone */
        }

        .score-btn {
            background: rgba(255, 255, 255, 0.22);
            border: 2px solid rgba(255, 255, 255, 0.85);
            color: #ffffff;
            padding: 11px 10px;
            font-size: 0.95rem;
            font-weight: 800;
            border-radius: 12px;
            cursor: pointer;
            backdrop-filter: blur(6px);
            text-shadow: 0 1px 3px rgba(0, 0, 0, 0.3);
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.15);
            transition: transform 0.1s, background-color 0.1s;
            touch-action: manipulation;
        }

        .score-btn:active {
            transform: scale(0.95);
            background: rgba(255, 255, 255, 0.45);
        }

        /* Top bar reset button with safe area top spacing */
        #top-bar {
            position: absolute;
            top: calc(16px + env(safe-area-inset-top, 0px));
            left: 50%;
            transform: translateX(-50%);
            z-index: 30;
        }

        .reset-btn {
            background-color: #1a1a1a;
            color: #ffffff;
            border: 2px solid #ffffff;
            padding: 10px 24px;
            font-size: 1.05rem;
            font-weight: 800;
            border-radius: 25px;
            cursor: pointer;
            box-shadow: 0 4px 14px rgba(0, 0, 0, 0.4);
            transition: all 0.2s ease;
            outline: none;
        }

        .reset-btn:active {
            transform: scale(0.95);
            background-color: #333333;
        }

        /* Auto-focus pulsing gold animation when match is won */
        .reset-btn.pulse-glow,
        .reset-btn:focus {
            animation: pulseGlow 1.2s infinite alternate;
            border-color: #FFD700 !important;
            color: #FFD700 !important;
        }

        @keyframes pulseGlow {
            0% {
                transform: scale(1);
                box-shadow: 0 0 0 0 rgba(255, 215, 0, 0.8), 0 0 10px rgba(255, 215, 0, 0.5);
            }
            100% {
                transform: scale(1.12);
                box-shadow: 0 0 20px 10px rgba(255, 215, 0, 0.4), 0 0 28px rgba(255, 215, 0, 0.8);
            }
        }

        /* Gold Winner Banner Overlay */
        #winner-banner {
            display: none;
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: #FFD700;
            color: #000000;
            padding: 22px 42px;
            font-size: 2.2rem;
            font-weight: 900;
            border-radius: 16px;
            z-index: 40;
            box-shadow: 0 12px 36px rgba(0, 0, 0, 0.6);
            text-align: center;
            border: 3px solid #ffffff;
            letter-spacing: 1px;
        }

        /* Landscape Mode & Low Screen Height Optimization (< 540px height or landscape orientation) */
        @media (max-height: 540px), (orientation: landscape) and (max-height: 600px) {
            #top-bar {
                top: calc(8px + env(safe-area-inset-top, 0px));
            }

            .reset-btn {
                padding: 6px 18px;
                font-size: 0.85rem;
                border-width: 1.5px;
            }

            /* Scaled up score display size in landscape mode while avoiding overlap */
            .score-display {
                top: 36%;
                font-size: 35vmin;
            }

            .tap-zone-upper {
                padding-top: calc(10px + env(safe-area-inset-top, 0px));
            }

            .tap-hint {
                font-size: 0.65rem;
                letter-spacing: 1px;
            }

            .tap-zone-lower {
                padding-bottom: calc(12px + env(safe-area-inset-bottom, 0px));
                padding-left: 8px;
                padding-right: 8px;
            }

            .tap-hint-bottom {
                margin-bottom: 4px;
            }

            /* Lay buttons out side-by-side horizontally in landscape */
            .button-group {
                flex-direction: row;
                max-width: 96%;
                gap: 6px;
            }

            .score-btn {
                flex: 1;
                padding: 8px 4px;
                font-size: 0.78rem;
                border-radius: 8px;
                white-space: nowrap;
                text-align: center;
            }

            #winner-banner {
                padding: 14px 28px;
                font-size: 1.6rem;
            }
        }
    </style>
</head>
<body>

    <!-- Central Reset Button -->
    <div id="top-bar">
        <button id="reset-btn" class="reset-btn" onclick="resetScores(event)">Reset Match</button>
    </div>

    <!-- Gold Winner Banner -->
    <div id="winner-banner"></div>

    <!-- Main Scoreboard Container -->
    <div id="scoreboard-container">
        
        <!-- Red Team Side -->
        <div id="red-side" class="team-side">
            <!-- Upper Tap Zone (+1 Point) -->
            <div class="tap-zone-upper" onclick="handleTapZone('red', 1, event)">
                <span class="tap-hint">TAP UPPER (+1)</span>
            </div>

            <!-- Score Digit placed cleanly above controls -->
            <div class="score-display" id="red-score">0</div>

            <!-- Lower Tap Zone (-1 Point & Action Buttons) -->
            <div class="tap-zone-lower" onclick="handleTapZone('red', -1, event)">
                <span class="tap-hint tap-hint-bottom">TAP LOWER (-1)</span>
                <div class="button-group">
                    <button class="score-btn" onclick="handleScoreButton('red', 1, event)">+1 (Spin)</button>
                    <button class="score-btn" onclick="handleScoreButton('red', 2, event)">+2 (Over/Burst)</button>
                    <button class="score-btn" onclick="handleScoreButton('red', 3, event)">+3 (X-Treme)</button>
                </div>
            </div>
        </div>

        <!-- Blue Team Side -->
        <div id="blue-side" class="team-side">
            <!-- Upper Tap Zone (+1 Point) -->
            <div class="tap-zone-upper" onclick="handleTapZone('blue', 1, event)">
                <span class="tap-hint">TAP UPPER (+1)</span>
            </div>

            <!-- Score Digit placed cleanly above controls -->
            <div class="score-display" id="blue-score">0</div>

            <!-- Lower Tap Zone (-1 Point & Action Buttons) -->
            <div class="tap-zone-lower" onclick="handleTapZone('blue', -1, event)">
                <span class="tap-hint tap-hint-bottom">TAP LOWER (-1)</span>
                <div class="button-group">
                    <button class="score-btn" onclick="handleScoreButton('blue', 1, event)">+1 (Spin)</button>
                    <button class="score-btn" onclick="handleScoreButton('blue', 2, event)">+2 (Over/Burst)</button>
                    <button class="score-btn" onclick="handleScoreButton('blue', 3, event)">+3 (X-Treme)</button>
                </div>
            </div>
        </div>

    </div>

    <script>
        let scores = { red: 0, blue: 0 };
        const TARGET_SCORE = 4;
        let matchOver = false;

        const redScoreEl = document.getElementById('red-score');
        const blueScoreEl = document.getElementById('blue-score');
        const resetBtn = document.getElementById('reset-btn');
        const banner = document.getElementById('winner-banner');

        /**
         * Upper (+1) and Lower (-1) background tap zone handler
         */
        function handleTapZone(team, change, event) {
            if (matchOver) return;
            updateScore(team, change);
        }

        /**
         * Score button (+1, +2, +3) click handler.
         * Calls stopPropagation() so tap zone underneath isn't triggered.
         */
        function handleScoreButton(team, points, event) {
            if (event) {
                event.stopPropagation();
            }
            if (matchOver) return;
            updateScore(team, points);
        }

        /**
         * Primary score logic and win condition evaluator
         */
        function updateScore(team, delta) {
            scores[team] += delta;
            
            // Prevent score from dropping below 0
            if (scores[team] < 0) scores[team] = 0;

            // Render updated score digits
            redScoreEl.innerText = scores.red;
            blueScoreEl.innerText = scores.blue;

            // Victory check (Target Score: 4)
            if (scores[team] >= TARGET_SCORE) {
                matchOver = true;
                banner.innerText = team.toUpperCase() + " WINS!";
                banner.style.display = 'block';

                // Automatically focus and add pulsing gold glow to Reset Match button
                resetBtn.classList.add('pulse-glow');
                resetBtn.focus();
            }
        }

        /**
         * Reset match state
         */
        function resetScores(event) {
            if (event) event.stopPropagation();

            scores.red = 0;
            scores.blue = 0;
            matchOver = false;

            redScoreEl.innerText = '0';
            blueScoreEl.innerText = '0';
            banner.style.display = 'none';

            // Clear pulse glow and reset focus
            resetBtn.classList.remove('pulse-glow');
            resetBtn.blur();
        }

        // Keyboard navigation: Pressing Enter or Space triggers reset when match is over
        document.addEventListener('keydown', (e) => {
            if (matchOver && (e.key === 'Enter' || e.key === ' ')) {
                resetScores();
            }
        });
    </script>

    <script>
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('./sw.js')
                    .then(reg => console.log('ServiceWorker registered successfully:', reg))
                    .catch(err => console.error('ServiceWorker registration failed:', err));
            });
        }
    </script>
</body>
</html>
